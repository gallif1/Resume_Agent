<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Apply - Acme Corp</title></head>
<body>
  <h1>Software Engineer</h1>
  <form id="application-form" action="#thanks" method="get"
        onsubmit="document.getElementById('thanks').hidden=false; return false;">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text" required />

    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" type="text" required />

    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" required />

    <label for="phone">Phone Number</label>
    <input id="phone" name="phone" type="tel" />

    <label for="resume">Upload Resume</label>
    <input id="resume" name="resume" type="file" accept=".pdf,.docx" required />

    <button type="submit">Submit Application</button>
  </form>
  <div id="thanks" hidden>
    <p>Thank you for applying! Your application has been submitted.</p>
  </div>
</body>
</html>
