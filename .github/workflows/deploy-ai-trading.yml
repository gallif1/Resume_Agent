# Deploy standalone AI Trading System beside Resume Agent (same EC2).
name: Deploy AI Trading System

on:
  workflow_dispatch:
    inputs:
      inspect_only:
        description: "Only inspect (no deploy)."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      configure_nginx:
        description: "Install temporary Nginx site on trading.<host> if Nginx exists (best-effort)."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: deploy-ai-trading
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trading repo
        uses: actions/checkout@v4
        with:
          repository: gallif1/ai-trading-system
          token: ${{ secrets.GH_PAT }}
          path: ai-trading-system

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.key
          chmod 600 ~/.ssh/ec2.key
          ssh-keygen -y -f ~/.ssh/ec2.key >/dev/null

      - name: Inspect and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          INSPECT_ONLY: ${{ github.event.inputs.inspect_only }}
          CONFIGURE_NGINX: ${{ github.event.inputs.configure_nginx }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRADING_AUTH_USER: ${{ secrets.TRADING_AUTH_USER }}
          TRADING_AUTH_PASSWORD: ${{ secrets.TRADING_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/ec2.key -o BatchMode=yes -o ConnectTimeout=12
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40)
          SCP=(scp -i ~/.ssh/ec2.key -o BatchMode=yes -o ConnectTimeout=12
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)

          echo "=== SERVER INSPECT ==="
          "${SSH[@]}" "${EC2_USERNAME}@${EC2_HOST}" 'hostname; whoami; date -u; sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"; ss -tlnp | head -40; command -v nginx; command -v caddy; command -v cloudflared; command -v certbot; sudo grep -RIn "server_name" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -40 || true; curl -sf --max-time 5 http://127.0.0.1:8001/api/health || curl -sf --max-time 5 http://127.0.0.1:8000/api/health || true; echo; curl -sf --max-time 5 https://checkip.amazonaws.com || true; echo'

          if [ "${INSPECT_ONLY}" = "true" ]; then
            echo "Inspect-only — exit"
            exit 0
          fi

          test -n "${TRADING_AUTH_USER:-}"
          test -n "${TRADING_AUTH_PASSWORD:-}"

          tar -C ai-trading-system --exclude='.git' --exclude='frontend/node_modules' \
            --exclude='frontend/dist' --exclude='data/*.json' --exclude='data/*.jsonl' \
            --exclude='.env' -czf /tmp/ai-trading-src.tgz .
          "${SCP[@]}" /tmp/ai-trading-src.tgz "${EC2_USERNAME}@${EC2_HOST}:/tmp/ai-trading-src.tgz"

          {
            printf 'TRADING_AUTH_USER=%s\n' "$TRADING_AUTH_USER"
            printf 'TRADING_AUTH_PASSWORD=%s\n' "$TRADING_AUTH_PASSWORD"
            printf 'TRADING_REQUIRE_AUTH=true\n'
            printf 'TRADING_BASE_PATH=\n'
            printf 'TRADING_DATA_DIR=/app/data\n'
            printf 'AI_ENABLED=true\n'
            printf 'AI_PROVIDER=openai\n'
            printf 'AI_MODEL=gpt-4o-mini\n'
            if [ -n "${FINNHUB_API_KEY:-}" ]; then printf 'FINNHUB_API_KEY=%s\n' "$FINNHUB_API_KEY"; fi
            if [ -n "${OPENAI_API_KEY:-}" ]; then printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"; fi
          } > /tmp/ai-trading.env
          "${SCP[@]}" /tmp/ai-trading.env "${EC2_USERNAME}@${EC2_HOST}:/tmp/ai-trading.env"
          rm -f /tmp/ai-trading.env

          "${SSH[@]}" "${EC2_USERNAME}@${EC2_HOST}" "CONFIGURE_NGINX=${CONFIGURE_NGINX}" bash -s <<'REMOTE'
          set -eu
          DEST="$HOME/ai-trading-system"
          mkdir -p "$DEST"
          tar -C "$DEST" -xzf /tmp/ai-trading-src.tgz
          mv /tmp/ai-trading.env "$DEST/.env"
          chmod 600 "$DEST/.env"

          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="$HOME/trading-data-backup-$STAMP"
          mkdir -p "$BACKUP"
          CID=$(sudo docker ps --format '{{.ID}} {{.Names}}' | awk '/resume|backend|agent/ {print $1; exit}')
          if [ -n "${CID:-}" ]; then
            echo "Pausing old /trading runtime"
            curl -sf -X POST --max-time 8 http://127.0.0.1:8001/trading/api/pause \
              || curl -sf -X POST --max-time 8 http://127.0.0.1:8000/trading/api/pause \
              || true
            sudo docker cp "$CID:/app/trading/data/." "$BACKUP/" 2>/dev/null || true
            echo "Backup: $BACKUP"; ls -la "$BACKUP" || true
          fi

          cd "$DEST"
          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose -p ai-trading-system"
          else
            COMPOSE="docker-compose -p ai-trading-system"
          fi
          echo "Building (may take several minutes on small EC2)..."
          sudo $COMPOSE build
          sudo $COMPOSE up -d --remove-orphans

          if [ -f "$BACKUP/runtime_state.json" ]; then
            echo "Seeding volume from backup"
            sudo docker cp "$BACKUP/." ai-trading-system:/app/data/
            sudo $COMPOSE restart
          fi

          ok=0
          for i in $(seq 1 40); do
            if sudo docker exec ai-trading-system sh -c \
              'curl -sf -u "$TRADING_AUTH_USER:$TRADING_AUTH_PASSWORD" http://127.0.0.1:8100/api/health' \
              >"$HOME/ai-trading-health.json" 2>/dev/null; then
              ok=1; break
            fi
            sleep 4
          done
          echo "=== TRADING HEALTH ==="
          cat "$HOME/ai-trading-health.json" 2>/dev/null || true
          echo
          sudo $COMPOSE ps
          if [ "$ok" != "1" ]; then
            sudo $COMPOSE logs --tail=150
            exit 1
          fi

          # Resume still healthy?
          curl -sf --max-time 8 http://127.0.0.1:8001/api/health >/tmp/ra.json \
            || curl -sf --max-time 8 http://127.0.0.1:8000/api/health >/tmp/ra.json
          echo "=== RESUME STILL OK ==="; cat /tmp/ra.json; echo

          if [ "${CONFIGURE_NGINX:-false}" = "true" ] && command -v nginx >/dev/null 2>&1; then
            DOMAIN=$(sudo grep -RhoE 'server_name[[:space:]]+[^;]+' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null \
              | awk '{print $2}' | tr -d ';' | grep -vE '^_|localhost' | head -1 || true)
            if [ -n "${DOMAIN:-}" ]; then
              TRADE_HOST="trading.${DOMAIN#*.}"
              # If DOMAIN is already apex like example.com, trading.example.com
              case "$DOMAIN" in
                *.*) TRADE_HOST="trading.${DOMAIN#*.}";;
                *) TRADE_HOST="trading.$DOMAIN";;
              esac
              # Prefer trading.<same FQDN parent>
              PARENT="$DOMAIN"
              if echo "$DOMAIN" | grep -q '\.'; then
                # resume.example.com -> trading.example.com
                PARENT=$(echo "$DOMAIN" | sed 's/^[^.]*\.//')
                TRADE_HOST="trading.$PARENT"
              fi
              echo "Configuring nginx for $TRADE_HOST -> 127.0.0.1:8100"
              sudo tee /etc/nginx/sites-available/ai-trading >/dev/null <<EOF
          server {
              listen 80;
              server_name $TRADE_HOST;
              location / {
                  proxy_pass http://127.0.0.1:8100;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 3600s;
              }
          }
          EOF
              sudo ln -sf /etc/nginx/sites-available/ai-trading /etc/nginx/sites-enabled/ai-trading
              sudo nginx -t && sudo systemctl reload nginx || true
              if command -v certbot >/dev/null 2>&1; then
                sudo certbot --nginx -d "$TRADE_HOST" --non-interactive --agree-tos -m admin@$PARENT --redirect || true
              fi
              echo "INTENDED_URL=https://$TRADE_HOST"
            else
              echo "No server_name found — skip nginx trading site"
              echo "INTENDED_URL=http://127.0.0.1:8100 (SSH tunnel / IP-restricted)"
            fi
          else
            echo "INTENDED_URL=http://127.0.0.1:8100 (localhost bind; use SSH tunnel or add reverse proxy)"
          fi

          echo "DEPLOY_OK"
          REMOTE
