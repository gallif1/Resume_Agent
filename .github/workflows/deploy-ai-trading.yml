# Deploy standalone AI Trading System beside Resume Agent (same EC2).
# Image is built on GitHub Actions — the EC2 host is too small to docker build safely.
name: Deploy AI Trading System

on:
  workflow_dispatch:
    inputs:
      inspect_only:
        description: "Only inspect (no deploy)."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      publish_port:
        description: "Bind host port 8100 (0.0.0.0). Keep false for localhost-only + SSH tunnel."
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]

concurrency:
  group: deploy-ai-trading
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.inputs.inspect_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trading repo
        uses: actions/checkout@v4
        with:
          repository: gallif1/ai-trading-system
          token: ${{ secrets.GH_PAT }}

      - name: Build image
        run: |
          set -euo pipefail
          docker build -t ai-trading-system:latest .
          docker save ai-trading-system:latest | gzip -1 > /tmp/ai-trading-system.tar.gz
          ls -lh /tmp/ai-trading-system.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-trading-image
          path: /tmp/ai-trading-system.tar.gz
          retention-days: 1

  deploy:
    needs: [build]
    if: ${{ always() && (github.event.inputs.inspect_only == 'true' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trading repo (compose + scripts)
        if: ${{ github.event.inputs.inspect_only != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: gallif1/ai-trading-system
          token: ${{ secrets.GH_PAT }}
          path: ai-trading-system

      - name: Download image
        if: ${{ github.event.inputs.inspect_only != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ai-trading-image
          path: /tmp/image

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.key
          chmod 600 ~/.ssh/ec2.key
          ssh-keygen -y -f ~/.ssh/ec2.key >/dev/null

      - name: Inspect / deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          INSPECT_ONLY: ${{ github.event.inputs.inspect_only }}
          PUBLISH_PORT: ${{ github.event.inputs.publish_port }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRADING_AUTH_USER: ${{ secrets.TRADING_AUTH_USER }}
          TRADING_AUTH_PASSWORD: ${{ secrets.TRADING_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/ec2.key -o BatchMode=yes -o ConnectTimeout=12
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40)
          SCP=(scp -i ~/.ssh/ec2.key -o BatchMode=yes -o ConnectTimeout=12
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)

          echo "=== SERVER SNAPSHOT ==="
          "${SSH[@]}" "${EC2_USERNAME}@${EC2_HOST}" bash -s <<'REMOTE'
          set -eu
          hostname; date -u
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          df -h / | head -3
          free -h
          command -v nginx || true
          sudo grep -RIn 'server_name' /etc/nginx/conf.d /etc/nginx/sites-enabled 2>/dev/null || true
          curl -sf --max-time 8 http://127.0.0.1:8001/api/health || echo 'resume_health=DOWN'
          echo
          curl -sf --max-time 5 https://checkip.amazonaws.com || true
          echo
          REMOTE

          if [ "${INSPECT_ONLY}" = "true" ]; then
            echo "Inspect-only complete"
            exit 0
          fi

          test -n "${TRADING_AUTH_USER:-}"
          test -n "${TRADING_AUTH_PASSWORD:-}"
          test -f /tmp/image/ai-trading-system.tar.gz

          echo "=== UPLOAD IMAGE + COMPOSE ==="
          "${SCP[@]}" /tmp/image/ai-trading-system.tar.gz \
            "${EC2_USERNAME}@${EC2_HOST}:/tmp/ai-trading-system.tar.gz"

          # Compose with optional public bind
          if [ "${PUBLISH_PORT}" = "true" ]; then
            PORTS_LINE='      - "8100:8100"'
          else
            PORTS_LINE='      - "127.0.0.1:8100:8100"'
          fi
          cat > /tmp/compose.override.yaml <<EOF
          services:
            trading:
              image: ai-trading-system:latest
              pull_policy: never
              ports: []
          EOF
          # Write a host compose that does not build
          cat > /tmp/ai-trading.compose.yaml <<EOF
          name: ai-trading-system
          services:
            trading:
              image: ai-trading-system:latest
              container_name: ai-trading-system
              restart: unless-stopped
              env_file:
                - .env
              environment:
                TRADING_HOST: "0.0.0.0"
                TRADING_PORT: "8100"
                TRADING_BASE_PATH: ""
                TRADING_DATA_DIR: /app/data
                TRADING_REQUIRE_AUTH: "true"
                PYTHONUNBUFFERED: "1"
              ports:
          ${PORTS_LINE}
              volumes:
                - trading_data:/app/data
              networks:
                - trading_net
              healthcheck:
                test: ["CMD-SHELL", "curl -sf -u \"\$\$TRADING_AUTH_USER:\$\$TRADING_AUTH_PASSWORD\" http://127.0.0.1:8100/api/health || exit 1"]
                interval: 30s
                timeout: 8s
                retries: 3
                start_period: 45s
              logging:
                driver: json-file
                options:
                  max-size: "20m"
                  max-file: "5"
          volumes:
            trading_data:
              name: ai-trading-system-data
          networks:
            trading_net:
              name: ai-trading-system-net
              driver: bridge
          EOF
          "${SCP[@]}" /tmp/ai-trading.compose.yaml \
            "${EC2_USERNAME}@${EC2_HOST}:/tmp/ai-trading.compose.yaml"

          {
            printf 'TRADING_AUTH_USER=%s\n' "$TRADING_AUTH_USER"
            printf 'TRADING_AUTH_PASSWORD=%s\n' "$TRADING_AUTH_PASSWORD"
            printf 'TRADING_REQUIRE_AUTH=true\n'
            printf 'TRADING_BASE_PATH=\n'
            printf 'TRADING_DATA_DIR=/app/data\n'
            printf 'AI_ENABLED=true\n'
            printf 'AI_PROVIDER=openai\n'
            printf 'AI_MODEL=gpt-4o-mini\n'
            if [ -n "${FINNHUB_API_KEY:-}" ]; then printf 'FINNHUB_API_KEY=%s\n' "$FINNHUB_API_KEY"; fi
            if [ -n "${OPENAI_API_KEY:-}" ]; then printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"; fi
          } > /tmp/ai-trading.env
          "${SCP[@]}" /tmp/ai-trading.env "${EC2_USERNAME}@${EC2_HOST}:/tmp/ai-trading.env"
          rm -f /tmp/ai-trading.env

          echo "=== REMOTE LOAD + START ==="
          "${SSH[@]}" "${EC2_USERNAME}@${EC2_HOST}" "PUBLISH_PORT=${PUBLISH_PORT}" bash -s <<'REMOTE'
          set -eu
          DEST="$HOME/ai-trading-system"
          mkdir -p "$DEST"
          mv /tmp/ai-trading.compose.yaml "$DEST/compose.yaml"
          mv /tmp/ai-trading.env "$DEST/.env"
          chmod 600 "$DEST/.env"

          echo "Freeing disk before image load..."
          sudo docker image prune -f || true
          sudo docker builder prune -f || true
          df -h / | head -3

          echo "Loading image (may take a minute)..."
          gunzip -c /tmp/ai-trading-system.tar.gz | sudo docker load
          rm -f /tmp/ai-trading-system.tar.gz
          sudo docker image ls ai-trading-system

          # Wait for Resume to be healthy before touching trading data
          echo "Waiting for Resume Agent..."
          for i in $(seq 1 40); do
            if curl -sf --max-time 5 http://127.0.0.1:8001/api/health >/tmp/ra.json; then
              echo "Resume healthy"; cat /tmp/ra.json; echo; break
            fi
            sleep 3
          done

          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="$HOME/trading-data-backup-$STAMP"
          mkdir -p "$BACKUP"
          CID=$(sudo docker ps --format '{{.ID}} {{.Names}}' | awk '/resume|backend|agent/ {print $1; exit}')
          if [ -n "${CID:-}" ]; then
            echo "Pausing old /trading"
            curl -sf -X POST --max-time 8 http://127.0.0.1:8001/trading/api/pause || true
            sudo docker cp "$CID:/app/trading/data/." "$BACKUP/" 2>/dev/null || true
            echo "Backup $BACKUP"; ls -la "$BACKUP" || true
          fi

          cd "$DEST"
          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose -p ai-trading-system -f compose.yaml"
          else
            COMPOSE="docker-compose -p ai-trading-system -f compose.yaml"
          fi
          sudo $COMPOSE up -d --remove-orphans --no-build

          if [ -f "$BACKUP/runtime_state.json" ]; then
            echo "Seeding volume from backup"
            sudo docker cp "$BACKUP/." ai-trading-system:/app/data/
            sudo $COMPOSE restart
          fi

          ok=0
          for i in $(seq 1 40); do
            if sudo docker exec ai-trading-system sh -c \
              'curl -sf -u "$TRADING_AUTH_USER:$TRADING_AUTH_PASSWORD" http://127.0.0.1:8100/api/health' \
              >"$HOME/ai-trading-health.json" 2>/dev/null; then
              ok=1; break
            fi
            sleep 3
          done
          echo "=== TRADING HEALTH ==="
          cat "$HOME/ai-trading-health.json" 2>/dev/null || true
          echo
          sudo $COMPOSE ps
          curl -sf --max-time 8 http://127.0.0.1:8001/api/health >/tmp/ra2.json || true
          echo "=== RESUME AFTER ==="; cat /tmp/ra2.json 2>/dev/null || true; echo

          PUB_IP=$(curl -sf --max-time 5 https://checkip.amazonaws.com || true)
          if [ "${PUBLISH_PORT}" = "true" ]; then
            echo "INTENDED_URL=http://${PUB_IP}:8100"
            echo "NOTE: No dedicated HTTPS subdomain on this host (Nginx serves tribe on :80)."
            echo "Basic Auth is required. Restrict SG/ufw to your IP ASAP."
          else
            echo "INTENDED_URL=http://127.0.0.1:8100 (SSH tunnel: ssh -L 8100:127.0.0.1:8100 user@host)"
          fi

          if [ "$ok" != "1" ]; then
            sudo $COMPOSE logs --tail=150
            exit 1
          fi
          echo "DEPLOY_OK"
          REMOTE
