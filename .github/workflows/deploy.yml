name: Deploy Resume Agent to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Also rebuild Docker image (slow). Leave false for instant recovery."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Cancel hung deploys so a fixed workflow can take over immediately.
concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Keep well under job timeout; must never hang forever.
          command_timeout: 15m
          script_stop: true
          # Avoid allocating a TTY that can keep the session open.
          request_pty: false
          envs: REBUILD
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            echo "Step 1: enter project directory"
            cd ~/resume-backend/Resume_Agent
            pwd

            echo "Step 2: pull latest master"
            # Fail fast if git is stuck on auth/network.
            timeout 60 git pull origin master

            echo "Step 3: recreate containers from existing image (detached)"
            # IMPORTANT: always use -d. Never plain "up".
            # Prefer docker compose v2; fall back to docker-compose v1.
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi
            echo "Using: $COMPOSE"

            # Bound docker client waits so compose cannot block forever.
            export DOCKER_CLIENT_TIMEOUT=120
            export COMPOSE_HTTP_TIMEOUT=120

            timeout 120 sudo $COMPOSE up -d --force-recreate --remove-orphans

            echo "Step 4: wait for /api/health"
            ok=0
            for i in $(seq 1 15); do
              echo "Health attempt $i/15..."
              if timeout 5 curl -sf http://127.0.0.1:8001/api/health >/tmp/ra-health.json \
                || timeout 5 curl -sf http://127.0.0.1:8000/api/health >/tmp/ra-health.json; then
                ok=1
                break
              fi
              sleep 2
            done

            echo "Step 5: show container status"
            timeout 30 sudo $COMPOSE ps || true
            timeout 30 sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true

            echo "Step 6: health payload"
            cat /tmp/ra-health.json 2>/dev/null || echo "(no health json)"
            echo

            if [ "$ok" != "1" ]; then
              echo "ERROR: health check failed after deploy" >&2
              timeout 30 sudo $COMPOSE logs --tail=120 || true
              exit 1
            fi

            echo "Step 7: SITE IS UP"

            if [ "${REBUILD:-false}" = "true" ]; then
              echo "Step 8: optional image rebuild requested"
              # Bound rebuild so SSH always returns.
              timeout 600 sudo docker build -t resume_agent-resume-backend .
              timeout 120 sudo $COMPOSE up -d --force-recreate --remove-orphans
              timeout 5 curl -sf http://127.0.0.1:8001/api/health \
                || timeout 5 curl -sf http://127.0.0.1:8000/api/health
              timeout 60 sudo docker image prune -f || true
              echo "Step 9: rebuild complete"
            else
              echo "Step 8: skipping image rebuild (instant deploy mode)"
            fi

            echo "Step 9: deploy script finished successfully"
            exit 0
        env:
          REBUILD: ${{ github.event.inputs.rebuild || 'false' }}
