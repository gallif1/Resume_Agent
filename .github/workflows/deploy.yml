name: Deploy Resume Agent to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: "Also rebuild the full Docker image on EC2 (slow; usually not needed)."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  # APP_VERSION and UI assets are baked at frontend build time.
  # Build them on the GitHub runner (fast/reliable) instead of a full
  # Playwright Docker rebuild on the small EC2 host (which hangs).
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: resume-agent-web/package-lock.json

      - name: Install and build
        working-directory: resume-agent-web
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/index.html
          VERSION="$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' src/lib/version.ts | head -1)"
          echo "Built frontend APP_VERSION=${VERSION}"
          test -n "$VERSION"
          if ! grep -R --fixed-strings "$VERSION" dist >/dev/null; then
            echo "ERROR: APP_VERSION ${VERSION} not found in dist bundle" >&2
            exit 1
          fi
          echo "Frontend dist ready:"
          du -sh dist
          find dist -maxdepth 2 -type f | head -30

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: resume-agent-web/dist
          if-no-files-found: error
          retention-days: 2

  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          echo "Step 1: write SSH key"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.key
          chmod 600 ~/.ssh/ec2.key
          test -s ~/.ssh/ec2.key
          ssh-keygen -y -f ~/.ssh/ec2.key >/dev/null
          echo "Step 1 done: key ok"

      - name: SSH connectivity probe
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail
          echo "Step 2: SSH probe to ${EC2_USERNAME}@${EC2_HOST}"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "SSH probe attempt ${attempt}/6..."
            if timeout 20s ssh \
              -i ~/.ssh/ec2.key \
              -o BatchMode=yes \
              -o ConnectTimeout=8 \
              -o ConnectionAttempts=1 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=2 \
              -o IdentitiesOnly=yes \
              "${EC2_USERNAME}@${EC2_HOST}" \
              'echo PROBE_OK; hostname; date -u; whoami; uptime; exit 0'
            then
              ok=1
              break
            fi
            echo "SSH probe attempt ${attempt} failed — waiting before retry"
            sleep $((attempt * 5))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::EC2 SSH unreachable (banner/port 22 timeout)."
            echo "The instance is likely overloaded or hung after a Docker build."
            echo "Reboot the EC2 instance in AWS Console, wait ~2 minutes, then Re-run this workflow."
            exit 1
          fi
          echo "Step 2 done: probe ok"

      - name: Upload frontend bundle to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail
          echo "Step 3: upload frontend dist"
          test -f frontend-dist/index.html
          tar -C frontend-dist -czf /tmp/ra-frontend-dist.tgz .
          timeout 60s scp \
            -i ~/.ssh/ec2.key \
            -o BatchMode=yes \
            -o ConnectTimeout=8 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o IdentitiesOnly=yes \
            /tmp/ra-frontend-dist.tgz \
            "${EC2_USERNAME}@${EC2_HOST}:/tmp/ra-frontend-dist.tgz"
          echo "Step 3 done: frontend uploaded"

      - name: Deploy via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          REBUILD_IMAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rebuild_image || 'false' }}
        run: |
          set -euo pipefail
          echo "Step 4: run remote deploy (REBUILD_IMAGE=${REBUILD_IMAGE})"

          cat > /tmp/ra-remote-deploy.sh <<'REMOTE'
          #!/bin/bash
          set -eu
          echo "Step R1: enter project directory"
          cd "$HOME/resume-backend/Resume_Agent"
          pwd

          echo "Step R2: pull latest master"
          git pull origin master
          BACKEND_REVISION="$(git rev-parse HEAD)"
          echo "Backend revision to deploy: $BACKEND_REVISION"

          echo "Step R3: choose compose"
          # Always --no-build: a full image build on this small EC2 hangs sshd
          # (banner timeout) and leaves the host unreachable until reboot.
          if docker compose version >/dev/null 2>&1; then
            UP_CMD='docker compose up -d --no-build --remove-orphans'
            UP_FORCE_CMD='docker compose up -d --no-build --force-recreate --remove-orphans'
            RESTART_CMD='docker compose restart'
            PS_CMD='docker compose ps'
            LOGS_CMD='docker compose logs --tail=120'
          else
            UP_CMD='docker-compose up -d --no-build --remove-orphans'
            UP_FORCE_CMD='docker-compose up -d --no-build --force-recreate --remove-orphans'
            RESTART_CMD='docker-compose restart'
            PS_CMD='docker-compose ps'
            LOGS_CMD='docker-compose logs --tail=120'
          fi
          echo "compose command: $UP_CMD"

          wait_for_health() {
            local max_attempts="$1"
            local i=1
            while [ "$i" -le "$max_attempts" ]; do
              echo "Health attempt $i/$max_attempts..."
              if curl -sf --max-time 8 http://127.0.0.1:8001/api/health >"$HOME/ra-health.json" \
                || curl -sf --max-time 8 http://127.0.0.1:8000/api/health >"$HOME/ra-health.json"; then
                return 0
              fi
              i=$((i + 1))
              sleep 3
            done
            return 1
          }

          find_container_id() {
            local cid
            cid="$(sudo docker ps --format '{{.ID}} {{.Names}}' | awk '/resume|backend|agent/ {print $1; exit}')"
            if [ -z "${cid:-}" ]; then
              cid="$(sudo docker ps -q | head -n 1)"
            fi
            printf '%s' "$cid"
          }

          inject_backend() {
            local cid="$1"
            echo "Injecting backend source into $cid (revision $BACKEND_REVISION)"
            # The whole src/ tree ships as one unit. A hand-picked file list used
            # to be injected instead, which silently kept the container running
            # months-old modules while the workflow still reported success.
            # Missing imports are handled below (deps install + rollback) rather
            # than by shipping less code.
            #
            # Also vendor job-apply-automation into src/job_apply so fast
            # --no-build deploys get Auto Apply without a full image rebuild
            # (the base image often predates that package).
            printf '%s\n' "$BACKEND_REVISION" > ai-job-agent/src/BUILD_REVISION
            rm -rf /tmp/ra-backend-bundle
            mkdir -p /tmp/ra-backend-bundle
            cp -a ai-job-agent/src /tmp/ra-backend-bundle/src
            cp -a ai-job-agent/requirements.txt /tmp/ra-backend-bundle/requirements.txt
            if [ -d job-apply-automation/src/job_apply ]; then
              rm -rf /tmp/ra-backend-bundle/src/job_apply
              cp -a job-apply-automation/src/job_apply /tmp/ra-backend-bundle/src/job_apply
              echo "Bundled job_apply into backend inject tarball"
            else
              echo "WARN: job-apply-automation/src/job_apply missing on host" >&2
            fi
            tar -C /tmp/ra-backend-bundle -czf /tmp/ra-backend-src.tgz src requirements.txt
            sudo docker cp /tmp/ra-backend-src.tgz "$cid:/tmp/ra-backend-src.tgz"
            # Snapshot the code that is currently serving so a broken injection
            # can be undone in place, without waiting for an image recreate.
            sudo docker exec "$cid" sh -c \
              'rm -rf /tmp/ra-src-backup && cp -a /app/ai-job-agent/src /tmp/ra-src-backup'
            sudo docker exec "$cid" sh -c \
              'tar -C /app/ai-job-agent -xzf /tmp/ra-backend-src.tgz && rm -f /tmp/ra-backend-src.tgz && find /app/ai-job-agent/src -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true'
          }

          inject_job_apply_sidecar() {
            local cid="$1"
            # Keep the standalone layout used by Dockerfile PYTHONPATH as well.
            if [ ! -d job-apply-automation/src/job_apply ]; then
              echo "WARN: skip job-apply sidecar inject — package missing on host" >&2
              return 0
            fi
            echo "Injecting job-apply-automation sidecar into $cid"
            tar -C . -czf /tmp/ra-job-apply.tgz job-apply-automation
            sudo docker cp /tmp/ra-job-apply.tgz "$cid:/tmp/ra-job-apply.tgz"
            sudo docker exec "$cid" sh -c \
              'rm -rf /app/job-apply-automation && tar -C /app -xzf /tmp/ra-job-apply.tgz && rm -f /tmp/ra-job-apply.tgz && find /app/job-apply-automation -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true'
          }

          backend_imports_ok() {
            local cid="$1"
            # Freshly injected trees have no __pycache__. Importing api_server on a
            # small EC2 that is also serving traffic can take well over 60s — treat
            # that as slow, not as a missing dependency.
            timeout 180s sudo docker exec "$cid" python -c \
              'import sys; sys.path.insert(0, "/app/ai-job-agent/src"); print("importing api_server", flush=True); import api_server; print("ok", flush=True); from pathlib import Path; p=Path("/app/ai-job-agent/src/job_apply"); print("job_apply_vendored="+str(p.is_dir()), flush=True); p2=Path("/app/job-apply-automation/src/job_apply"); print("job_apply_sidecar="+str(p2.is_dir()), flush=True)' \
              >"$HOME/ra-import-check.log" 2>&1
          }

          import_check_missing_dep() {
            # Only real missing-module failures should trigger pip on this host.
            grep -qE 'ModuleNotFoundError|ImportError' "$HOME/ra-import-check.log" 2>/dev/null
          }

          install_backend_deps() {
            local cid="$1"
            local pip_pid
            echo "Installing backend requirements inside $cid"
            # Cap pip tightly: a full requirements sync pegs this small EC2 and
            # used to hang sshd. Heartbeats keep the SSH session alive.
            (
              timeout 180s sudo docker exec "$cid" pip install --no-input \
                --disable-pip-version-check -r /app/ai-job-agent/requirements.txt \
                >"$HOME/ra-pip-install.log" 2>&1
            ) &
            pip_pid=$!
            while kill -0 "$pip_pid" 2>/dev/null; do
              echo "pip still running ($(date -u +%H:%M:%S))..."
              sleep 15
            done
            wait "$pip_pid"
          }

          restore_backend() {
            local cid="$1"
            echo "Restoring the backend source that was serving before this deploy"
            sudo docker exec "$cid" sh -c \
              'test -d /tmp/ra-src-backup && rm -rf /app/ai-job-agent/src && cp -a /tmp/ra-src-backup /app/ai-job-agent/src' \
              || echo "WARN: no backup to restore" >&2
          }

          live_backend_revision() {
            sed -n 's/.*"backend_revision"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
              "$HOME/ra-health.json" 2>/dev/null | head -1 || true
          }

          inject_frontend() {
            local cid="$1"
            echo "Injecting frontend bundle into $cid"
            sudo docker exec "$cid" mkdir -p /app/resume-agent-web/dist
            sudo docker exec "$cid" sh -c 'rm -rf /app/resume-agent-web/dist/*'
            sudo docker cp /tmp/ra-frontend-dist.tgz "$cid:/tmp/ra-frontend-dist.tgz"
            sudo docker exec "$cid" sh -c \
              'mkdir -p /app/resume-agent-web/dist && tar -C /app/resume-agent-web/dist -xzf /tmp/ra-frontend-dist.tgz && rm -f /tmp/ra-frontend-dist.tgz'
          }

          # Optional full image rebuild — off by default (hangs on small EC2).
          if [ "${REBUILD_IMAGE:-false}" = "true" ]; then
            echo "Step R4: full Docker image rebuild (requested)"
            timeout 480s sudo docker build -t resume_agent-resume-backend . \
              </dev/null >"$HOME/ra-docker-build.log" 2>&1 || {
              echo "ERROR: docker build failed/timed out" >&2
              tail -n 120 "$HOME/ra-docker-build.log" || true
              exit 1
            }
            echo "docker build finished"
            tail -n 40 "$HOME/ra-docker-build.log" || true
          else
            echo "Step R4: skipping full image rebuild (fast frontend path)"
          fi

          echo "Step R5: ensure containers are running (detached, FDs closed, no build)"
          ensure_container_running() {
            timeout 90s sudo sh -c "$UP_CMD" </dev/null >"$HOME/ra-compose-up.log" 2>&1 || {
              echo "WARN: compose up failed; retrying with force-recreate" >&2
              timeout 90s sudo sh -c "$UP_FORCE_CMD" </dev/null >"$HOME/ra-compose-up.log" 2>&1 || return 1
            }
            return 0
          }

          if ! ensure_container_running; then
            echo "ERROR: compose up failed/timed out" >&2
            tail -n 80 "$HOME/ra-compose-up.log" || true
            sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' </dev/null || true
            exit 1
          fi
          echo "compose up finished"
          tail -n 40 "$HOME/ra-compose-up.log" || true

          CID="$(find_container_id)"
          if [ -z "${CID:-}" ]; then
            echo "WARN: no running container after compose up; forcing recreate" >&2
            timeout 90s sudo sh -c "$UP_FORCE_CMD" </dev/null >"$HOME/ra-compose-up.log" 2>&1 || {
              echo "ERROR: force-recreate failed" >&2
              tail -n 80 "$HOME/ra-compose-up.log" || true
              sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' </dev/null || true
              exit 1
            }
            CID="$(find_container_id)"
          fi
          if [ -z "${CID:-}" ]; then
            echo "ERROR: no running docker container found after compose recovery" >&2
            sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' </dev/null || true
            exit 1
          fi
          echo "Base container: $CID"

          echo "Step R6: baseline health before injecting new code"
          if ! wait_for_health 25; then
            echo "WARN: baseline health failed; force-recreating container from image" >&2
            timeout 90s sudo sh -c "$UP_FORCE_CMD" </dev/null >"$HOME/ra-compose-recover.log" 2>&1 || true
            CID="$(find_container_id)"
            if [ -z "${CID:-}" ] || ! wait_for_health 30; then
              echo "ERROR: baseline health failed after force-recreate" >&2
              sudo sh -c "$LOGS_CMD" </dev/null >"$HOME/ra-compose-logs.log" 2>&1 || true
              tail -n 120 "$HOME/ra-compose-logs.log" || true
              sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' </dev/null || true
              exit 1
            fi
          fi

          echo "Step R7: inject backend + frontend into running container"
          test -f /tmp/ra-frontend-dist.tgz
          echo "Target container: $CID"
          inject_backend "$CID"
          inject_job_apply_sidecar "$CID"

          echo "Step R7b: check the injected backend imports before restarting"
          IMPORT_OK=0
          backend_imports_ok "$CID" && IMPORT_OK=1 || true
          if [ "$IMPORT_OK" != "1" ]; then
            echo "WARN: injected backend import check failed" >&2
            tail -n 40 "$HOME/ra-import-check.log" || true
            if import_check_missing_dep; then
              echo "WARN: missing dependency detected — installing requirements" >&2
              install_backend_deps "$CID" || echo "WARN: pip install failed/timed out" >&2
              tail -n 30 "$HOME/ra-pip-install.log" 2>/dev/null || true
            else
              echo "WARN: no ModuleNotFoundError — retrying import once (likely cold compile/timeout)" >&2
              sleep 5
            fi
            IMPORT_OK=0
            backend_imports_ok "$CID" && IMPORT_OK=1 || true
            if [ "$IMPORT_OK" != "1" ]; then
              echo "::error::Injected backend fails to import." >&2
              echo "Re-run this workflow with rebuild_image=true to rebuild the image from scratch." >&2
              tail -n 60 "$HOME/ra-import-check.log" || true
              restore_backend "$CID"
              # Prefer image baseline over a possibly-corrupt in-place backup.
              timeout 90s sudo sh -c "$UP_FORCE_CMD" </dev/null >"$HOME/ra-compose-recover.log" 2>&1 || true
              CID="$(find_container_id)"
              if [ -n "${CID:-}" ]; then
                timeout 60s sudo sh -c "$RESTART_CMD" </dev/null >/dev/null 2>&1 \
                  || timeout 30s sudo docker restart "$CID" </dev/null >/dev/null 2>&1 \
                  || true
              fi
              wait_for_health 30 || true
              exit 1
            fi
          fi
          echo "Injected backend imports cleanly"

          inject_frontend "$CID"

          echo "Restarting container to pick up backend + frontend updates"
          timeout 60s sudo sh -c "$RESTART_CMD" </dev/null >"$HOME/ra-compose-restart.log" 2>&1 \
            || timeout 30s sudo docker restart "$CID" </dev/null >/dev/null 2>&1 \
            || true
          tail -n 40 "$HOME/ra-compose-restart.log" 2>/dev/null || true

          echo "Step R8: post-inject health check"
          if ! wait_for_health 45; then
            echo "WARN: health failed after inject; rolling back to image baseline" >&2
            timeout 90s sudo sh -c "$UP_FORCE_CMD" </dev/null >"$HOME/ra-compose-recover.log" 2>&1 || true
            tail -n 40 "$HOME/ra-compose-recover.log" 2>/dev/null || true
            CID="$(find_container_id)"
            if [ -n "${CID:-}" ]; then
              inject_frontend "$CID"
              timeout 60s sudo sh -c "$RESTART_CMD" </dev/null >"$HOME/ra-compose-restart2.log" 2>&1 \
                || timeout 30s sudo docker restart "$CID" </dev/null >/dev/null 2>&1 \
                || true
            fi
            if wait_for_health 30; then
              echo "ERROR: deploy inject failed, but site restored to previous image baseline" >&2
              sudo sh -c "$LOGS_CMD" </dev/null >"$HOME/ra-compose-logs.log" 2>&1 || true
              tail -n 120 "$HOME/ra-compose-logs.log" || true
              exit 1
            fi
            echo "ERROR: health check failed even after rollback" >&2
            sudo sh -c "$LOGS_CMD" </dev/null >"$HOME/ra-compose-logs.log" 2>&1 || true
            tail -n 120 "$HOME/ra-compose-logs.log" || true
            sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' </dev/null || true
            exit 1
          fi

          echo "Step R8b: verify the live backend is the revision we just shipped"
          LIVE_REVISION="$(live_backend_revision)"
          echo "shipped: $BACKEND_REVISION"
          echo "live:    ${LIVE_REVISION:-(not reported)}"
          if [ "${LIVE_REVISION:-}" != "$BACKEND_REVISION" ]; then
            echo "::error::The container is not serving the deployed backend revision." >&2
            echo "The site is up, but it is running older code — treat this deploy as failed." >&2
            echo "Check that the injected path (/app/ai-job-agent/src) is the one the process imports." >&2
            cat "$HOME/ra-health.json" 2>/dev/null || echo "(no health json)"
            exit 1
          fi
          echo "Live backend revision matches the deployed revision"

          echo "Step R8: status"
          sudo sh -c "$PS_CMD" </dev/null >"$HOME/ra-compose-ps.log" 2>&1 || true
          cat "$HOME/ra-compose-ps.log" || true
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' </dev/null || true

          echo "Step R9: health payload"
          cat "$HOME/ra-health.json" 2>/dev/null || echo "(no health json)"
          echo

          echo "Step R9b: job-apply package health"
          if curl -sf --max-time 8 http://127.0.0.1:8001/api/job-apply/health >"$HOME/ra-job-apply-health.json" \
            || curl -sf --max-time 8 http://127.0.0.1:8000/api/job-apply/health >"$HOME/ra-job-apply-health.json"; then
            cat "$HOME/ra-job-apply-health.json"
            echo
            if grep -q '"package_found"[[:space:]]*:[[:space:]]*"false"' "$HOME/ra-job-apply-health.json"; then
              echo "::error::job-apply package still missing inside the container after inject." >&2
              echo "Re-run with rebuild_image=true, or check inject_job_apply_sidecar logs." >&2
              exit 1
            fi
          else
            echo "WARN: /api/job-apply/health unreachable (older backend?)" >&2
          fi
          echo
          echo "Step R10: verify frontend bundle serves index.html"
          curl -sf --max-time 5 http://127.0.0.1:8001/ >/tmp/ra-index.html \
            || curl -sf --max-time 5 http://127.0.0.1:8000/ >/tmp/ra-index.html \
            || true
          head -c 200 /tmp/ra-index.html 2>/dev/null || echo "(no index)"
          echo

          echo "Step R11: SITE IS UP"
          echo "Step R12: remote deploy finished"
          exit 0
          REMOTE

          chmod +x /tmp/ra-remote-deploy.sh

          timeout 30s scp \
            -i ~/.ssh/ec2.key \
            -o BatchMode=yes \
            -o ConnectTimeout=8 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o IdentitiesOnly=yes \
            /tmp/ra-remote-deploy.sh \
            "${EC2_USERNAME}@${EC2_HOST}:/tmp/ra-remote-deploy.sh"

          echo "Step 5: run remote deploy (max 14 minutes)"
          # Keepalives must tolerate multi-minute docker/pip work on a small EC2.
          # Interval=5/CountMax=2 previously dropped the session (~10s silence)
          # during pip, leaving the host mid-inject with no rollback.
          timeout 840s ssh \
            -i ~/.ssh/ec2.key \
            -o BatchMode=yes \
            -o ConnectTimeout=8 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            -o IdentitiesOnly=yes \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "REBUILD_IMAGE=${REBUILD_IMAGE} bash /tmp/ra-remote-deploy.sh"

          echo "Step 6: deploy workflow finished successfully"
