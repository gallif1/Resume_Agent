# Recover OPENAI_API_KEY from EC2 (container / trading .env) when the
# GitHub Actions secret is missing/empty, then write it back as a repo
# secret and inject into the Resume Agent container for /cv-tailor.
# Never prints the key value.
name: Restore OPENAI API Key

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.key
          chmod 600 ~/.ssh/ec2.key
          ssh-keygen -y -f ~/.ssh/ec2.key >/dev/null

      - name: Recover key from EC2 and sync GitHub secret
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "GitHub secret OPENAI_API_KEY is already set (length=${#OPENAI_API_KEY})"
            KEY_SOURCE=github
            KEY_VALUE="$OPENAI_API_KEY"
          else
            echo "GitHub secret OPENAI_API_KEY is empty — searching EC2 for a surviving copy"
            KEY_SOURCE=missing
            KEY_VALUE=""
          fi

          # Pull candidate key from EC2 without echoing it into logs.
          # stdout = KEY line only; stderr = FOUND_FROM=... status (safe).
          ssh -i ~/.ssh/ec2.key -o BatchMode=yes -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "${EC2_USERNAME}@${EC2_HOST}" bash -s <<'REMOTE' \
            > /tmp/ra-openai-found.env 2>/tmp/ra-openai-found.meta
          set -eu
          found_from=""

          try_file() {
            local label="$1"
            local path="$2"
            if [ -f "$path" ] && grep -q '^OPENAI_API_KEY=.' "$path" 2>/dev/null; then
              grep '^OPENAI_API_KEY=' "$path" | head -1 > /tmp/ra-openai-found.env
              found_from="$label"
              return 0
            fi
            return 1
          }

          try_file "host_resume_env" "$HOME/resume-backend/Resume_Agent/.env" || true
          if [ ! -s /tmp/ra-openai-found.env ]; then
            try_file "trading_env" "$HOME/ai-trading-system/.env" || true
          fi
          # Common leftover / backup names from past deploys
          if [ ! -s /tmp/ra-openai-found.env ]; then
            for cand in \
              "$HOME/resume-backend/Resume_Agent/.env.bak" \
              "$HOME/resume-backend/Resume_Agent/ai-job-agent/.env" \
              "$HOME/resume-backend/.env" \
              "$HOME/.env" \
              /tmp/ra-trading-secrets.env \
              /tmp/ai-trading.env \
              /tmp/ra-resume-secrets.env
            do
              try_file "path:$cand" "$cand" && break || true
            done
          fi

          CID=$(sudo docker ps --format '{{.ID}} {{.Names}}' | awk 'tolower($0) ~ /resume|backend|agent/ {print $1; exit}')
          if [ ! -s /tmp/ra-openai-found.env ] && [ -n "${CID:-}" ]; then
            sudo docker exec "$CID" sh -c '
              if [ -f /app/ai-job-agent/.env ] && grep -q "^OPENAI_API_KEY=." /app/ai-job-agent/.env; then
                grep "^OPENAI_API_KEY=" /app/ai-job-agent/.env | head -1
              fi
            ' > /tmp/ra-openai-found.env 2>/dev/null || true
            if [ -s /tmp/ra-openai-found.env ]; then
              found_from="resume_container_env"
            fi
          fi

          TCID=$(sudo docker ps --format '{{.ID}} {{.Names}}' | awk 'tolower($0) ~ /trading/ {print $1; exit}')
          if [ ! -s /tmp/ra-openai-found.env ] && [ -n "${TCID:-}" ]; then
            sudo docker exec "$TCID" sh -c '
              if [ -f /app/.env ] && grep -q "^OPENAI_API_KEY=." /app/.env; then
                grep "^OPENAI_API_KEY=" /app/.env | head -1
              elif printenv OPENAI_API_KEY >/tmp/ov 2>/dev/null && [ -s /tmp/ov ]; then
                printf "OPENAI_API_KEY=%s\n" "$(cat /tmp/ov)"
              fi
            ' > /tmp/ra-openai-found.env 2>/dev/null || true
            if [ -s /tmp/ra-openai-found.env ]; then
              found_from="trading_container"
            fi
          fi

          if [ ! -s /tmp/ra-openai-found.env ]; then
            # Last resort: process environment inside the running resume container.
            if [ -n "${CID:-}" ]; then
              sudo docker exec "$CID" sh -c 'printenv OPENAI_API_KEY' > /tmp/ra-openai-val 2>/dev/null || true
              if [ -s /tmp/ra-openai-val ]; then
                printf 'OPENAI_API_KEY=%s\n' "$(cat /tmp/ra-openai-val)" > /tmp/ra-openai-found.env
                found_from="resume_container_process_env"
              fi
              rm -f /tmp/ra-openai-val
            fi
          fi

          if [ -s /tmp/ra-openai-found.env ]; then
            echo "FOUND_FROM=${found_from:-unknown}" >&2
            cat /tmp/ra-openai-found.env
          else
            echo "FOUND_FROM=none" >&2
          fi
          REMOTE

          EC2_KEY=""
          if [ -s /tmp/ra-openai-found.env ] && grep -q '^OPENAI_API_KEY=.' /tmp/ra-openai-found.env; then
            EC2_KEY="$(sed -n 's/^OPENAI_API_KEY=//p' /tmp/ra-openai-found.env | head -1)"
            # Strip optional surrounding quotes
            EC2_KEY="${EC2_KEY#\"}"
            EC2_KEY="${EC2_KEY%\"}"
            EC2_KEY="${EC2_KEY#\'}"
            EC2_KEY="${EC2_KEY%\'}"
            FOUND_FROM="$(grep '^FOUND_FROM=' /tmp/ra-openai-found.env 2>/dev/null || true)"
          fi
          # FOUND_FROM went to stderr of remote; re-run note from file size
          if [ -n "${EC2_KEY:-}" ]; then
            echo "Recovered OPENAI_API_KEY from EC2 (length=${#EC2_KEY}) — value not logged"
            if [ -z "${KEY_VALUE:-}" ]; then
              KEY_VALUE="$EC2_KEY"
              KEY_SOURCE=ec2
            fi
          else
            echo "No OPENAI_API_KEY found on EC2 host/container/trading .env"
          fi

          rm -f /tmp/ra-openai-found.env

          if [ -z "${KEY_VALUE:-}" ]; then
            echo "::error::OPENAI_API_KEY is missing in GitHub secrets and was not found on EC2."
            echo "Add it manually: GitHub → Settings → Secrets → Actions → OPENAI_API_KEY"
            echo "Then re-run Deploy Resume Agent to EC2 (or this workflow)."
            exit 1
          fi

          if [ "$KEY_SOURCE" = "ec2" ] || [ "$KEY_SOURCE" = "github" ]; then
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "::warning::GH_PAT missing — cannot write GitHub secret; will still inject into EC2 container"
            else
              echo "Writing OPENAI_API_KEY to GitHub Actions secret on $GITHUB_REPOSITORY"
              printf '%s' "$KEY_VALUE" | gh secret set OPENAI_API_KEY -R "$GITHUB_REPOSITORY"
              echo "GitHub secret OPENAI_API_KEY updated"
            fi
          fi

          # Inject into Resume Agent host + container .env and restart.
          : > /tmp/ra-openai-only.env
          printf 'OPENAI_API_KEY=%s\n' "$KEY_VALUE" > /tmp/ra-openai-only.env
          scp -i ~/.ssh/ec2.key -o BatchMode=yes -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            /tmp/ra-openai-only.env \
            "${EC2_USERNAME}@${EC2_HOST}:/tmp/ra-openai-only.env"
          rm -f /tmp/ra-openai-only.env

          ssh -i ~/.ssh/ec2.key -o BatchMode=yes -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "${EC2_USERNAME}@${EC2_HOST}" bash -s <<'REMOTE'
          set -eu
          cd "$HOME/resume-backend/Resume_Agent"
          touch .env
          grep -v '^OPENAI_API_KEY=' .env > /tmp/ra-host-env-merged.env || true
          grep '^OPENAI_API_KEY=' /tmp/ra-openai-only.env >> /tmp/ra-host-env-merged.env
          mv /tmp/ra-host-env-merged.env .env
          chmod 600 .env
          echo "Host .env now has OPENAI_API_KEY (presence only)"
          grep -q '^OPENAI_API_KEY=.' .env && echo "host_openai=present" || echo "host_openai=missing"

          CID=$(sudo docker ps --format '{{.ID}} {{.Names}}' | awk 'tolower($0) ~ /resume|backend|agent/ {print $1; exit}')
          if [ -z "${CID:-}" ]; then
            echo "ERROR: resume container not running" >&2
            exit 1
          fi
          sudo docker cp /tmp/ra-openai-only.env "$CID:/tmp/ra-openai-only.env"
          sudo docker exec "$CID" sh -c '
            set -eu
            mkdir -p /app/ai-job-agent
            touch /app/ai-job-agent/.env
            grep -v "^OPENAI_API_KEY=" /app/ai-job-agent/.env > /tmp/ra-env-merged.env || true
            grep "^OPENAI_API_KEY=" /tmp/ra-openai-only.env >> /tmp/ra-env-merged.env
            mv /tmp/ra-env-merged.env /app/ai-job-agent/.env
            chmod 600 /app/ai-job-agent/.env
            rm -f /tmp/ra-openai-only.env
            grep -q "^OPENAI_API_KEY=." /app/ai-job-agent/.env && echo "container_openai=present" || echo "container_openai=missing"
          '
          rm -f /tmp/ra-openai-only.env
          echo "Restarting resume container to load key"
          sudo docker restart "$CID" >/dev/null
          ok=0
          for i in $(seq 1 40); do
            if curl -sf --max-time 5 http://127.0.0.1:8001/api/health >"$HOME/ra-health.json"; then
              ok=1
              break
            fi
            sleep 3
          done
          cat "$HOME/ra-health.json" 2>/dev/null || true
          echo
          if [ "$ok" != "1" ]; then
            echo "ERROR: health failed after inject" >&2
            exit 1
          fi
          if grep -q '"openai_configured"[[:space:]]*:[[:space:]]*true' "$HOME/ra-health.json" 2>/dev/null; then
            echo "openai_configured=true — CV Tailor ready"
          elif grep -q '"openai_configured"[[:space:]]*:[[:space:]]*false' "$HOME/ra-health.json" 2>/dev/null; then
            echo "::warning::openai_configured=false after inject — process may not have reloaded .env"
          else
            # Older backend without the field — verify file presence only.
            echo "NOTE: health has no openai_configured field yet; container file inject done"
          fi
          echo "RESTORE_OK"
          REMOTE
