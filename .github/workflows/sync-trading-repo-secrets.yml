# One-shot / occasional: copy EC2 deploy secrets into gallif1/ai-trading-system
# so that repo can auto-deploy on push. Does not print secret values.
name: Sync Trading Repo Secrets

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy secrets to ai-trading-system
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          TRADING_AUTH_USER: ${{ secrets.TRADING_AUTH_USER }}
          TRADING_AUTH_PASSWORD: ${{ secrets.TRADING_AUTH_PASSWORD }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          test -n "${EC2_HOST:-}"
          test -n "${EC2_USERNAME:-}"
          test -n "${EC2_SSH_KEY:-}"
          REPO=gallif1/ai-trading-system
          printf '%s' "$EC2_HOST" | gh secret set EC2_HOST -R "$REPO"
          printf '%s' "$EC2_USERNAME" | gh secret set EC2_USERNAME -R "$REPO"
          printf '%s' "$EC2_SSH_KEY" | gh secret set EC2_SSH_KEY -R "$REPO"
          if [ -n "${TRADING_AUTH_USER:-}" ]; then
            printf '%s' "$TRADING_AUTH_USER" | gh secret set TRADING_AUTH_USER -R "$REPO"
          fi
          if [ -n "${TRADING_AUTH_PASSWORD:-}" ]; then
            printf '%s' "$TRADING_AUTH_PASSWORD" | gh secret set TRADING_AUTH_PASSWORD -R "$REPO"
          fi
          if [ -n "${FINNHUB_API_KEY:-}" ]; then
            printf '%s' "$FINNHUB_API_KEY" | gh secret set FINNHUB_API_KEY -R "$REPO"
          fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printf '%s' "$OPENAI_API_KEY" | gh secret set OPENAI_API_KEY -R "$REPO"
          fi
          echo "Synced secrets to $REPO:"
          gh secret list -R "$REPO"
