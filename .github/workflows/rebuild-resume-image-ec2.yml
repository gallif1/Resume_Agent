# Build Resume Agent image on GitHub Actions (EC2 cannot safely docker build).
name: Rebuild Resume Image on EC2

on:
  workflow_dispatch:

concurrency:
  group: rebuild-resume-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          set -euo pipefail
          docker build -t resume_agent-resume-backend:latest .
          docker save resume_agent-resume-backend:latest | gzip -1 > /tmp/resume-agent.tar.gz
          ls -lh /tmp/resume-agent.tar.gz
          # Split for more reliable SCP on small disks / flaky links
          split -b 200M -d /tmp/resume-agent.tar.gz /tmp/resume-agent.part.
          ls -lh /tmp/resume-agent.part.*
          mkdir -p /tmp/resume-parts
          mv /tmp/resume-agent.part.* /tmp/resume-parts/
          du -sh /tmp/resume-parts

      - uses: actions/upload-artifact@v4
        with:
          name: resume-agent-image-parts
          path: /tmp/resume-parts/
          retention-days: 1

  load:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resume-agent-image-parts
          path: /tmp/parts

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.key
          chmod 600 ~/.ssh/ec2.key
          ssh-keygen -y -f ~/.ssh/ec2.key >/dev/null

      - name: Free disk + load image + start
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/ec2.key -o BatchMode=yes -o ConnectTimeout=15
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
            -o ServerAliveInterval=30 -o ServerAliveCountMax=80)
          SCP=(scp -i ~/.ssh/ec2.key -o BatchMode=yes -o ConnectTimeout=15
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)

          echo "=== free disk on EC2 (keep trading + named volumes) ==="
          "${SSH[@]}" "${EC2_USERNAME}@${EC2_HOST}" bash -s <<'REMOTE'
          set -eu
          df -h / | head -3
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          # Clear leftover upload fragments
          # /tmp is often tmpfs (~half RAM) — too small for a 1.2G image. Use $HOME.
          UPLOAD_DIR="$HOME/resume-image-upload"
          sudo rm -f /tmp/resume-agent.tar.gz /tmp/resume-agent.part.* 2>/dev/null || true
          rm -rf "$UPLOAD_DIR"
          mkdir -p "$UPLOAD_DIR/parts"
          # Remove dangling images only; never prune volumes
          sudo docker image prune -f || true
          sudo docker container prune -f || true
          sudo docker builder prune -f || true
          df -h / /tmp 2>/dev/null | head -10
          free -h
          echo "UPLOAD_DIR=$UPLOAD_DIR"
          REMOTE

          echo "=== upload parts to \$HOME (not /tmp) ==="
          ls -lh /tmp/parts
          "${SCP[@]}" /tmp/parts/* "${EC2_USERNAME}@${EC2_HOST}:~/resume-image-upload/parts/"

          "${SSH[@]}" "${EC2_USERNAME}@${EC2_HOST}" bash -s <<'REMOTE'
          set -eu
          UPLOAD_DIR="$HOME/resume-image-upload"
          df -h / /tmp 2>/dev/null | head -10
          echo "Assembling tarball on root filesystem..."
          cat "$UPLOAD_DIR/parts"/resume-agent.part.* > "$UPLOAD_DIR/resume-agent.tar.gz"
          rm -rf "$UPLOAD_DIR/parts"
          ls -lh "$UPLOAD_DIR/resume-agent.tar.gz"

          # Keep trading up
          sudo docker ps --format '{{.Names}}' | grep -q ai-trading-system

          echo "Loading Resume image..."
          gunzip -c "$UPLOAD_DIR/resume-agent.tar.gz" | sudo docker load
          rm -rf "$UPLOAD_DIR"
          sudo docker images | head -20
          df -h / | head -3

          cd "$HOME/resume-backend/Resume_Agent"
          if docker compose version >/dev/null 2>&1; then
            sudo docker compose up -d --no-build || true
          else
            sudo docker-compose up -d --no-build || true
          fi

          if ! sudo docker ps --format '{{.Names}}' | grep -qiE 'resume'; then
            echo "Compose did not start resume — docker run fallback"
            sudo docker rm -f resume_agent_backend 2>/dev/null || true
            MOUNT="-v $HOME/resume-backend/Resume_Agent/data:/app/ai-job-agent/data"
            if [ -d "$HOME/resume-backend/Resume_Agent/ai-job-agent/data" ]; then
              MOUNT="-v $HOME/resume-backend/Resume_Agent/ai-job-agent/data:/app/ai-job-agent/data"
            fi
            sudo docker run -d --name resume_agent_backend --restart unless-stopped \
              -p 8001:8000 $MOUNT resume_agent-resume-backend:latest
          fi

          ok=0
          for i in $(seq 1 50); do
            if curl -sf --max-time 8 http://127.0.0.1:8001/api/health >"$HOME/ra-health.json"; then
              ok=1; break
            fi
            echo "wait health $i"
            sleep 4
          done
          echo "=== containers ==="
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          cat "$HOME/ra-health.json" 2>/dev/null || true
          echo
          if [ -f "$HOME/ai-trading-system/.env" ]; then
            set -a; . "$HOME/ai-trading-system/.env"; set +a
            curl -sf -u "$TRADING_AUTH_USER:$TRADING_AUTH_PASSWORD" http://127.0.0.1:8100/api/health | head -c 200 || true
            echo
          fi
          if [ "$ok" != "1" ]; then
            sudo docker logs --tail 100 resume_agent_backend 2>&1 || true
            sudo docker ps -a | head -20
            exit 1
          fi
          echo "RESUME_IMAGE_LOAD_OK"
          REMOTE
