name: Recover Resume Agent on EC2

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.key
          chmod 600 ~/.ssh/ec2.key
          ssh-keygen -y -f ~/.ssh/ec2.key >/dev/null

      - name: Recover compose stack
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ec2.key -o BatchMode=yes -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "${EC2_USERNAME}@${EC2_HOST}" bash -s <<'REMOTE'
          set -eu
          echo "=== before ==="
          sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          df -h / | head -3
          free -h

          # Do not touch ai-trading-system
          echo "Trading still up?"
          sudo docker ps --format '{{.Names}} {{.Status}}' | grep ai-trading || echo 'trading missing'

          cd "$HOME/resume-backend/Resume_Agent"
          echo "=== compose file ==="
          cat docker-compose.yml || true
          echo "=== images ==="
          sudo docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' | head -40
          echo "=== all containers ==="
          sudo docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | head -40

          # NEVER prune — a previous recover deleted the stopped Resume container.
          IMG=""
          for cand in resume_agent-resume-backend resume_agent_backend resume-agent resume-backend; do
            if sudo docker image inspect "$cand" >/dev/null 2>&1; then
              IMG="$cand"
              break
            fi
          done
          # Also match by repository substring
          if [ -z "$IMG" ]; then
            IMG=$(sudo docker images --format '{{.Repository}}:{{.Tag}}' | awk '/resume/ {print; exit}')
          fi
          echo "Selected image: ${IMG:-NONE}"

          if docker compose version >/dev/null 2>&1; then
            COMPOSE='docker compose'
          else
            COMPOSE='docker-compose'
          fi

          echo "Starting Resume Agent compose..."
          set +e
          timeout 120s sudo $COMPOSE up -d --no-build </dev/null
          UP_RC=$?
          set -e
          echo "compose_exit=$UP_RC"

          if ! sudo docker ps --format '{{.Names}}' | grep -qE 'resume|backend|agent'; then
            echo "Compose did not start a resume container — falling back to docker run"
            if [ -n "$IMG" ]; then
              sudo docker rm -f resume_agent_backend 2>/dev/null || true
              # Match historical deploy ports + persistent data volume if present
              DATA_VOL=""
              if sudo docker volume ls --format '{{.Name}}' | grep -q 'resume'; then
                DATA_VOL=$(sudo docker volume ls --format '{{.Name}}' | awk '/resume|data/ {print; exit}')
              fi
              # Prefer host bind used historically
              if [ -d "$HOME/resume-backend/Resume_Agent/ai-job-agent/data" ]; then
                MOUNT="-v $HOME/resume-backend/Resume_Agent/ai-job-agent/data:/app/ai-job-agent/data"
              elif [ -d "$HOME/resume-backend/Resume_Agent/data" ]; then
                MOUNT="-v $HOME/resume-backend/Resume_Agent/data:/app/ai-job-agent/data"
              elif [ -n "${DATA_VOL:-}" ]; then
                MOUNT="-v ${DATA_VOL}:/app/ai-job-agent/data"
              else
                MOUNT="-v resume-agent-data:/app/ai-job-agent/data"
              fi
              echo "docker run with $MOUNT"
              sudo docker run -d --name resume_agent_backend --restart unless-stopped \
                -p 8001:8000 \
                $MOUNT \
                "$IMG"
            else
              echo "ERROR: no resume image on host. Need rebuild_image=true deploy."
              sudo docker images
              exit 1
            fi
          fi

          echo "=== after up ==="
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

          ok=0
          for i in $(seq 1 40); do
            if curl -sf --max-time 5 http://127.0.0.1:8001/api/health >"$HOME/ra-health.json"; then
              ok=1
              break
            fi
            echo "wait health $i"
            sleep 3
          done
          cat "$HOME/ra-health.json" 2>/dev/null || true
          echo
          curl -sf -u "$(grep TRADING_AUTH_USER "$HOME/ai-trading-system/.env" | cut -d= -f2-):$(grep TRADING_AUTH_PASSWORD "$HOME/ai-trading-system/.env" | cut -d= -f2-)" \
            http://127.0.0.1:8100/api/health | head -c 200 || echo 'trading_check_failed'
          echo
          if [ "$ok" != "1" ]; then
            sudo docker logs --tail 80 resume_agent_backend || true
            exit 1
          fi
          echo "RECOVER_OK"
          REMOTE
